<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="ping.me.at at a glance: Real checks, live, Four states, not two, Honest about itself, Your page, your domain">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Real checks,</tspan><tspan x="44" dy="22">live</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Every visit sends one</tspan><tspan x="44" dy="21">real request to each</tspan><tspan x="44" dy="21">service. Nothing is</tspan><tspan x="44" dy="21">cached, and one</tspan><tspan x="44" dy="21">failing check never</tspan><tspan x="44" dy="21">breaks the page.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Four states,</tspan><tspan x="256" dy="22">not two</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Operational,</tspan><tspan x="256" dy="21">unreachable, unknown</tspan><tspan x="256" dy="21">and late. Every row</tspan><tspan x="256" dy="21">says where it was</tspan><tspan x="256" dy="21">checked from.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Honest about</tspan><tspan x="468" dy="22">itself</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">ping shows its own</tspan><tspan x="468" dy="21">row as unknown,</tspan><tspan x="468" dy="21">states its interval,</tspan><tspan x="468" dy="21">and lists its blind</tspan><tspan x="468" dy="21">spots by date.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Your page, your</tspan><tspan x="680" dy="22">domain</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">Host status pages for</tspan><tspan x="680" dy="21">your services on a</tspan><tspan x="680" dy="21">DNS-verified</tspan><tspan x="680" dy="21">hostname, with</tspan><tspan x="680" dy="21">incidents and</tspan><tspan x="680" dy="21">history.</tspan></text>
</svg>
